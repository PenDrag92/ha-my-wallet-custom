name: Release

on:
  push:
    branches: ["release/publish-v1.11.1"]

permissions:
  contents: write

jobs:
  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 705f546b497726a2b0cbcd34bdfe09c44259d0ea
      - name: Build release files
        env:
          RELEASE_TAG: v1.11.1
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          root = Path(".")
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")
          version = tag[1:]
          manifest = json.loads(
              (root / "custom_components/my_wallet/manifest.json").read_text()
          )
          if manifest["version"] != version:
              raise SystemExit(
                  f"Tag {tag} does not match manifest {manifest['version']}"
              )

          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## {re.escape(version)}\s*\n(.*?)(?=^## |\Z)", changelog
          )
          if match is None:
              raise SystemExit(f"No CHANGELOG section for {version}")

          output = root / "dist"
          output.mkdir()
          notes = output / "release-notes.md"
          notes.write_text(match.group(1).strip() + "\n", encoding="utf-8")
          archive = output / f"ha-my-wallet-{version}.zip"
          roots = [
              root / "custom_components/my_wallet",
              root / "README.md",
              root / "CHANGELOG.md",
              root / "LICENSE",
              root / "hacs.json",
          ]
          with ZipFile(archive, "w", ZIP_DEFLATED) as package:
              for source in roots:
                  files = [source] if source.is_file() else source.rglob("*")
                  for path in sorted(item for item in files if item.is_file()):
                      if "__pycache__" not in path.parts and path.suffix != ".pyc":
                          package.write(path, path.as_posix())

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum = output / "SHA256SUMS.txt"
          checksum.write_text(f"{digest}  {archive.name}\n", encoding="ascii")
          PY
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITHUB_REF_NAME="v1.11.1"
          VERSION="1.11.1"
          ARCHIVE="dist/ha-my-wallet-${VERSION}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" dist/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --title "My Wallet ${VERSION}" --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" dist/SHA256SUMS.txt --target 705f546b497726a2b0cbcd34bdfe09c44259d0ea --latest --title "My Wallet ${VERSION}" --notes-file dist/release-notes.md
          fi
